[workspace]
resolver = "2"
members = ["crates/*", ".", "tools/format-registry-generator"]
exclude = ["src-tauri"]

[package]
name = "nuwa-backup"
version = "0.1.0"
edition = "2021"
description = "Nuwa Backup"

[features]
default = ["history"]
history = ["rusqlite"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
hex = "0.4"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

