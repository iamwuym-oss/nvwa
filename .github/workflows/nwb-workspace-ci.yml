name: NWB Workspace CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  workspace:
    name: workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Toolchain info
        run: |
          rustc -Vv
          cargo -V
          echo "active toolchain:"
          rustup show active-toolchain

      - name: Format check
        run: cargo fmt --all -- --check
      - name: Format Registry check
        run: cargo run --locked -p format-registry-generator -- check

      - name: Requirements traceability check
        run: cargo run --locked -p traceability-checker -- check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build (debug)
        run: cargo build --workspace --locked

      - name: Build (release)
        run: cargo build --workspace --release --locked
