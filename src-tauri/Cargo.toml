[package]
name = "nuwa-tauri"
version = "0.1.0"
description = "Nuwa Backup - Desktop GUI (Tauri 2.0)"
edition = "2021"

[lib]
name = "nuwa_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nuwa-backup = { path = ".." }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
